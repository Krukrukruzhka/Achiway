services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: achiway
      POSTGRES_USER: achiway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U achiway -d achiway"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
