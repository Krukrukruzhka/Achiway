name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: Deploy to the prepared production server (leave unchecked to publish images only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  images:
    name: Build, verify and publish images
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.publish.outputs.backend_digest }}
      frontend_digest: ${{ steps.publish.outputs.frontend_digest }}
    env:
      BACKEND_IMAGE: ghcr.io/krukrukruzhka/achiway-backend:${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/krukrukruzhka/achiway-frontend:${{ github.sha }}
      POSTGRES_PASSWORD: ci-only-password
      COMPOSE_PROJECT_NAME: achiway-image-check
      HTTP_BIND_HOST: 127.0.0.1
      HTTP_PORT: "18080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Linux amd64 images
        run: |
          docker build --platform linux/amd64 -f backend-services/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$BACKEND_IMAGE" .
          docker build --platform linux/amd64 -f frontend/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$FRONTEND_IMAGE" .
      - name: Verify containers with a disposable database
        run: |
          docker compose --env-file /dev/null -f deploy/compose.yaml up -d --wait --wait-timeout 90 db
          docker compose --env-file /dev/null -f deploy/compose.yaml run --rm --no-deps backend alembic upgrade head
          docker compose --env-file /dev/null -f deploy/compose.yaml run --rm --no-deps backend alembic check
          docker compose --env-file /dev/null -f deploy/compose.yaml up -d --wait --wait-timeout 90 backend frontend
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18080/api/health/ready | jq -e '.status == "ok"'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18080/habits -o "$RUNNER_TEMP/habits.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/habits.html"
          status=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/habits)
          test "$status" = 401
      - name: Publish the verified images
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/achiway-registry"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          backend_ref=$(docker image inspect "$BACKEND_IMAGE" --format '{{index .RepoDigests 0}}')
          frontend_ref=$(docker image inspect "$FRONTEND_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "backend_digest=${backend_ref##*@}" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=${frontend_ref##*@}" >> "$GITHUB_OUTPUT"
          {
            echo "### Images for $GITHUB_SHA"
            echo "Backend: $backend_ref"
            echo "Frontend: $frontend_ref"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file /dev/null -f deploy/compose.yaml logs --no-color --tail 100
      - name: Remove the disposable database and registry login
        if: always()
        run: |
          docker compose --env-file /dev/null -f deploy/compose.yaml down --volumes
          docker --config "$RUNNER_TEMP/achiway-registry" logout ghcr.io

  deploy:
    name: Deploy production
    if: inputs.deploy_to_server
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: http://37.230.168.87:8020
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
      FRONTEND_DIGEST: ${{ needs.images.outputs.frontend_digest }}
    steps:
      - name: Deploy over restricted SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$BACKEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          umask 077
          key_file="$RUNNER_TEMP/deploy-key"
          hosts_file="$RUNNER_TEMP/deploy-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "achiway-deploy@$DEPLOY_HOST" "deploy $BACKEND_DIGEST $FRONTEND_DIGEST"
      - name: Verify public HTTP endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 10 \
            "http://$DEPLOY_HOST:8020/api/health/ready" | jq -e '.status == "ok"'
