server {
    listen 80;
    server_name 37.230.168.87;

    location /.well-known/acme-challenge/ {
        root /var/lib/achiway-acme;
    }

    location / {
        return 308 https://37.230.168.87$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 37.230.168.87;
    ssl_certificate /etc/letsencrypt/live/37.230.168.87/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/37.230.168.87/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        if (!-f /opt/achiway/current.json) {
            return 503;
        }
        if (-f /opt/achiway/maintenance) {
            return 503;
        }
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    error_page 503 @maintenance;
    location @maintenance {
        default_type text/plain;
        add_header Retry-After 60 always;
        return 503 "Achiway is updating. Please retry shortly.\n";
    }
}
